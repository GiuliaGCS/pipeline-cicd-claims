name: Pipeline CI/CD - Validacao de Claims

# Dispara a pipeline a cada push/PR na branch main,
# e permite tambem execucao manual (workflow_dispatch)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------
  # ETAPA DE CI (Continuous Integration)
  # ---------------------------------------------------------------
  ci-build-e-testes:
    name: "CI - Build e Testes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar testes automatizados (pytest)
        run: pytest tests/ -v

      - name: Rodar validacao de duplicidade (gera relatorios e site)
        run: |
          python src/validar_duplicatas.py data/duplicates_2.csv \
            --limite-duplicidade 0.1

      - name: Upload dos relatorios como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-validacao
          path: reports/

      - name: Upload do site estatico (para o job de deploy)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ---------------------------------------------------------------
  # ETAPA DE CD (Continuous Delivery/Deployment)
  # So roda se a etapa de CI passar, e apenas na branch main
  # ---------------------------------------------------------------
  cd-deploy-pages:
    name: "CD - Deploy no GitHub Pages"
    needs: ci-build-e-testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
